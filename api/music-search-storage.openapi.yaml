openapi: 3.0.3
info:
  title: Music search storage recovery
  version: 1.0.0
paths:
  /api/v1/music/search:
    get:
      summary: 음악 검색과 검색 결과의 영속 접수
      description: 검색 성공 응답 전 Outbox 접수 커밋을 확인하며 음악 저장 완료는 기다리지 않는다.
      responses:
        '200':
          description: 기존 음악 검색 및 cursor paging 응답
        '503':
          description: 검색 결과 영속 접수 커밋을 확인하지 못함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/music-search-storage/{jobId}/requeue:
    post:
      operationId: requeueDeadMusicSearchJob
      summary: 실패한 음악 검색 저장 작업 재투입
      description: |
        음악 검색 결과 저장 작업 중 DEAD 상태인 작업만 즉시 QUEUED로 되돌린다.
        attempt_count는 0으로 초기화되고 다음 worker poll에서 다시 처리될 수 있다.
        ROLE_ADMIN 권한이 필요하며 기존 JWT, 요청 출처 및 CSRF 보호를 적용한다.
        현재 최신 payload의 identity, 관찰 시각과 version은 보존한다.
        해당 DLQ 실패 이력에 replay 시각을 기록하며 과거 실패 payload는 보존한다.
        검색 metadata나 원본 payload는 응답에 포함하지 않는다.
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 재투입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: music search job requeued
                data:
                  job_id: 7
                  status: QUEUED
        '401':
          description: 인증되지 않음 또는 토큰 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ADMIN 권한 없음, CSRF 검증 실패 또는 허용되지 않은 요청 출처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 작업 ID가 존재하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 작업 상태가 DEAD가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 재투입 트랜잭션을 완료하지 못함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          type: object
          required: [job_id, status]
          properties:
            job_id:
              type: integer
              format: int64
            status:
              type: string
              enum: [QUEUED]
    ErrorResponse:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          type: object
          nullable: true
          example: null
