openapi: 3.0.3
info:
  title: Music record update
  version: 1.0.0
paths:
  /api/v1/music-records/{record_id}:
    patch:
      operationId: updateMusicRecord
      summary: 본인 음악 기록의 곡 또는 메모 수정
      description: |
        인증된 사용자가 소유한 활성 음악 기록을 부분 수정한다. music을 전달하면 곡을 교체하고
        custom_place_name과 emotion_memo는 요청에 포함된 경우에만 수정한다. 생략한 장소와 메모는
        보존하며 위치·지역·생성 시각은 항상 보존한다.
        music만 전달했으며 곡이 기존 곡과 같으면 iTunes 조회나 DB 쓰기 없이 성공하고 updated_at을
        변경하지 않는다. 같은 곡과 함께 장소명이나 메모가 달라졌다면 해당 메타데이터를 수정한다.
        다른 곡이면 iTunes lookup에 성공한 뒤 음악 카탈로그와 기록을 같은 트랜잭션에서 갱신한다.
        소유권 확인을 요청 필드 검증보다 먼저 수행한다. 유효한 JSON이지만 구조가 잘못된 요청은
        본인 기록에서 400, 타인 기록에서는 403이다. 잘못된 JSON 문법은 400이다.
      security:
        - bearerAuth: []
      parameters:
        - name: record_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                music:
                  type: object
                  additionalProperties: false
                  required: [provider, external_music_id]
                  properties:
                    provider:
                      type: string
                      enum: [ITUNES]
                    external_music_id:
                      type: string
                      pattern: '^[0-9]+$'
                custom_place_name:
                  type: string
                  nullable: true
                  maxLength: 100
                emotion_memo:
                  type: string
                  nullable: true
                  maxLength: 500
            examples:
              replaceMusic:
                summary: 곡만 교체
                value:
                  music:
                    provider: ITUNES
                    external_music_id: '456'
              replaceMusicAndMemo:
                summary: 곡과 메모 수정
                value:
                  music:
                    provider: ITUNES
                    external_music_id: '456'
                  emotion_memo: 새로운 기분
      responses:
        '200':
          description: 수정 완료 또는 동일 곡 요청의 성공 no-op
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: music record updated
                data:
                  record_id: 7
                  updated_at: '2026-10-03T13:30:00Z'
        '400':
          description: JSON 문법, 요청 구조, 수정값 또는 변경 사항이 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { message: invalid request, data: null }
        '401':
          description: 인증되지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 다른 사용자의 활성 기록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { message: forbidden, data: null }
        '404':
          description: 기록이 없거나 iTunes에서 곡을 찾지 못함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: iTunes 조회 실패 또는 제공 메타데이터가 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { message: music provider unavailable, data: null }
        '500':
          description: 저장 실패. 트랜잭션을 롤백함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          type: object
          required: [record_id, updated_at]
          properties:
            record_id:
              type: integer
              format: int64
            updated_at:
              type: string
              format: date-time
              nullable: true
    ErrorResponse:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          nullable: true
