openapi: 3.0.3
info:
  title: Regional chat participation
  version: 1.3.0
  description: >-
    Single-server admission and account-per-room capacity. Membership is bound to the
    verified access JWT sub/sid. Missing or noncanonical sid requires login again.
    Account-wide logout remains unchanged until the separate logout work.
paths:
  /api/v1/regions/{region_id}/chat-room:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: region_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Pre-provisioned active SIGUNGU room
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      room_id: { type: integer, format: int64 }
                      region_id: { type: integer, format: int64 }
                      region_name: { type: string }
                      capacity: { type: integer, example: 25 }
                      status: { type: string, enum: [ACTIVE] }
        '401': { description: Authentication required; membership mutation also requires canonical signed JWT sid }
        '404': { description: Active room not found }
  /api/v1/chat-rooms/{room_id}/members:
    post:
      description: >-
        Creates or reuses membership for the signed JWT sid. Same sid and room return
        the existing active membership; a different sid creates independent membership.
        The authenticated sid is never read from a request field or device header.
        Location evidence must be issued for this same signed sid; unbound or other-session
        evidence is rejected before changing participation. Existing same-session region-transition
        behavior is retained; other sessions are untouched. Each successful POST allocates a new
        view_session_id for one tab, even when membership is reused. No reading interval
        starts before the actual room subscription.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: room_id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_resolution_token]
              properties:
                location_resolution_token: { type: string }
      responses:
        '201':
          description: New session membership; reserve the account in this room for 30 seconds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '200':
          description: Same active sid and room membership with a new tab view and its own 30-second reservation; other tab deadlines stay unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { description: Invalid, expired, unbound, foreign-owner, foreign-session or region-mismatched location token }
        '401': { description: Authentication required; membership mutation also requires canonical signed JWT sid }
        '403':
          description: Inactive user or active chat ban; ban message is chat use banned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    nullable: true
                    properties:
                      banned_until: { type: string, format: date-time, description: UTC ban expiry when actively banned }
        '404': { description: Active room not found }
        '409': { description: Distinct accounts with connections, reservations or grace have reached capacity; another session of an existing account in this room is allowed }
  /api/v1/chat-rooms/{room_id}/members/me:
    delete:
      description: Ends only the specified tab view owned by the signed JWT sub/sid, room and membership. Its sockets close with 4100 CHAT_LEFT and its recovery permission ends immediately, without disconnect grace. Other tabs and devices keep their connections and reservations. Repeated leave is idempotent. The device membership ends when no unended durable views or runtime tabs remain.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: room_id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: membership_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: view_session_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Departure confirmed or already departed }
        '400': { description: Required participation identifier missing or malformed }
        '401': { description: Authentication required; membership mutation also requires canonical signed JWT sid }
        '403': { description: Membership or view does not belong to the account, signed authentication session and room }
  /api/v1/chat-rooms/{room_id}/region-departures:
    post:
      description: >-
        Confirms device-wide departure using location evidence bound to the signed JWT sub/sid.
        The evidence must identify a region different from the old room. All tabs of only this
        membership close with 4100 CHAT_LEFT, even before destination lookup or admission.
        Navigation must use DELETE members/me with view_session_id instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: room_id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: membership_id, in: query, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_resolution_token]
              properties:
                location_resolution_token: { type: string }
      responses:
        '204': { description: Moving session departure confirmed }
        '400': { description: Missing identifier or invalid, expired, foreign-session or same-region location evidence }
        '401': { description: Authentication with canonical signed JWT sid required }
        '403': { description: Membership does not belong to this account and session }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    MembershipResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          required: [membership_id, room_id, region_id, joined_at, view_session_id]
          properties:
            membership_id: { type: integer, format: int64 }
            room_id: { type: integer, format: int64 }
            region_id: { type: integer, format: int64 }
            view_session_id: { type: string, format: uuid, description: Opaque tab view; send from the first CONNECT and for explicit departure; never persist in conversation cache }
            joined_at: { type: string, format: date-time, description: UTC with Z suffix }
