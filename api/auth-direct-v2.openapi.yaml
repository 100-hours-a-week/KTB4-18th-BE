      operationId: prepareDirectAuthFlow
      summary: Prepare or reuse a direct-v2 flow after an explicit login-button action
      description: Synchronous, credential-free flow bootstrap. FE sends this only after the user submits the login form and after persisting/readback of a bootstrap operation tuple. The body is absent and no email/password/token is sent. With no usable proof it creates an anonymous flow; a valid legacy MEO_AUTH_FLOW cookie resolves and upgrades the same anonymous flow; a valid direct-v2 proof returns the current canonical flow. Legacy QUEUED state is rejected; an authenticated flow is returned as authenticated and FE must not send login. The globally unique bootstrap operation ID is stored in auth_flow_bootstrap_operations in the same short MySQL transaction as flow creation/upgrade and the encrypted exact response. Same-ID retries match the stable request fingerprint and either the original proof fingerprint or exact current result proofs; they replay the exact body and separate physical Set-Cookie lines for 900 seconds only while the saved flow/status/epoch/revision and cookie generations remain canonical. Afterward a minimal tombstone returns 409 for another 86,400 seconds. Changed binding returns AUTH_OPERATION_ID_REUSED; later canonical mutation returns AUTH_OPERATION_SUPERSEDED; expiration returns AUTH_OPERATION_RECEIPT_EXPIRED. Rate limiting applies only to a new ID. No bootstrap mutation occurs during page mount. A resolved QUEUED flow (including a legacy flow) returns 409 AUTH_FLOW_LEGACY_QUEUED without mutation or cookies; direct-v2 success never reports QUEUED and currentTicket is null.
      parameters:
      - in: header
        name: X-Auth-Login-Protocol
        required: true
        schema:
          type: string
          const: direct-v2
      - in: header
        name: X-Auth-Flow-Operation-Id
        required: true
        description: Globally unique client UUID for bootstrap idempotency. Reuse only for the same explicit bootstrap intent; a retry must use the same ID and original request binding or exact current result proofs. The bootstrap result remains eligible for replay for 900 seconds.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-CSRF-TOKEN
        required: true
        description: Readable CSRF token paired with the browser XSRF-TOKEN cookie.
        schema:
          type: string
          minLength: 1
      - in: header
        name: Origin
        required: true
        description: Actual browser Origin; exact configured allowlist match required.
        schema:
          type: string
          format: uri
          minLength: 1
      security:
      - CsrfCookie: []
      - CsrfCookie: []
        DirectFlowProofCookie: []
      - CsrfCookie: []
        LegacyFlowCookie: []
      - CsrfCookie: []
        BrowserBindingProofCookie: []
      responses:
        '200':
          description: Canonical direct-v2 flow snapshot; no password/token in request or response. Always emits separate physical Set-Cookie header lines for the exact generation-scoped flow proof and browser-binding proof; a known request-present stale cookie name may also be expired with matching attributes. The ordered physical cookie lines and exact JSON body are encrypted in the bootstrap receipt for canonical same-ID replay. The operation ID is echoed.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
            X-Auth-Login-Protocol:
              required: true
              schema:
                type: string
                const: direct-v2
            X-Auth-Flow-Id:
              required: true
              schema:
                type: string
                format: uuid
            X-Auth-Flow-Epoch:
              required: true
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
            X-Auth-Flow-Revision:
              required: true
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
            X-Auth-Flow-Operation-Id:
              required: true
              schema:
                type: string
                format: uuid
            Set-Cookie:
              required: true
              description: Separate physical Set-Cookie header lines for the canonical direct flow proof and binding proof, plus only permitted request-present stale-name expirations; encrypted and replayed exactly while canonical. Browser-only, HttpOnly; never comma-join or expose to JavaScript.
              schema:
                type: string
              x-multiple-header-lines: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FlowEnvelope"
        '400':
          description: Invalid direct-v2 marker or bootstrap operation UUID.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeFlowBootstrap400"
        '403':
          description: CSRF or Origin rejected; no flow mutation or cookie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeFlowBootstrap403"
        '409':
          description: Queued legacy flow, reused/expired/superseded bootstrap ID; no login is allowed. A resolved QUEUED flow returns AUTH_FLOW_LEGACY_QUEUED.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeFlowBootstrap409"
        '429':
          description: Bootstrap rate limit reached; includes Retry-After and no new receipt.
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeFlowBootstrap429"
        '503':
          description: New admissions may be disabled (LOGIN_PROTOCOL_DISABLED) or canonical MySQL state may be unavailable; FE retains the same bootstrap ID and does not send login.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeFlowBootstrap503"
components:
  securitySchemes:
    DirectFlowProofCookie:
      type: apiKey
      in: cookie
      name: MEO_AUTH_FLOW_V2_<flow-key>_gN
      description: Dynamic cookie name pattern is MEO_AUTH_FLOW_V2_<base64url(SHA-256(UTF8(flow_id)))>_g<flow_cookie_generation>. HttpOnly; Path=/api/v1/auth; no Domain; Secure follows auth.cookie.secure; SameSite follows auth.cookie.same-site (default Lax); Max-Age matches flowCookieExpiresAt or effective DB session expiry.
      x-cookie-name-pattern: "^MEO_AUTH_FLOW_V2_[A-Za-z0-9_-]{43}_g[1-9][0-9]*$"
    CsrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
      description: Browser-managed HttpOnly XSRF-TOKEN cookie set by CookieCsrfTokenRepository, Path=/api/v1/auth. FE reads data.csrf_token from GET /token/csrf and echoes it in X-CSRF-TOKEN; browser sends cookie automatically.
    DirectRefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token_v2_<sid-key>_gN
      description: Dynamic name is refresh_token_v2_<base64url(SHA-256(UTF8(sid)))>_g<refresh_generation>. Browser-managed, HttpOnly, Path=/api/v1/auth, no Domain, configured Secure/SameSite.
      x-cookie-name-pattern: "^refresh_token_v2_[A-Za-z0-9_-]{43}_g[1-9][0-9]*$"
    LegacyFlowCookie:
      type: apiKey
      in: cookie
      name: MEO_AUTH_FLOW
      description: Headerless legacy compatibility only.
    LegacyRefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Legacy session rows only.
    BrowserBindingProofCookie:
      type: apiKey
      in: cookie
      name: MEO_AUTH_BINDING_V2_<flow-key>_gN
      description: Dynamic cookie name pattern is MEO_AUTH_BINDING_V2_<base64url(SHA-256(UTF8(flow_id)))>_g<binding_cookie_generation>. Random 256-bit value; DB stores only domain-separated HMAC-SHA-256. HttpOnly; SameSite=Lax; Path=/api/v1/auth; no Domain; Secure follows auth.cookie.secure; fixed Max-Age 1800 seconds. Accepted as a flow proof only by GET /api/v1/auth/flow; GET /api/v1/auth/flow/current-operation; GET /api/v1/auth/token/refresh/operations/{operationId}/session-recovery/current; GET /api/v1/auth/token/refresh/operations/{operationId}/session-recovery/{recoveryOperationId}; POST /api/v1/auth/flow/rebootstrap; POST /api/v1/auth/flows; POST /api/v1/auth/token/refresh/operations/{operationId}/session-recovery. It does not authorize POST /api/v1/auth/login, ordinary POST /api/v1/auth/token/refresh, POST /api/v1/auth/logout, or protected APIs.
      x-cookie-name-pattern: "^MEO_AUTH_BINDING_V2_[A-Za-z0-9_-]{43}_g[1-9][0-9]*$"
  schemas:
    ErrorCode:
      type: string
      enum:
      - INVALID_LOGIN_PROTOCOL
      - INVALID_OPERATION_ID
      - INVALID_CREDENTIALS
      - AUTH_LOGIN_IN_PROGRESS
      - LOGIN_RESULT_REQUIRES_RECOVERY
      - AUTH_LOGIN_SUPERSEDED
      - REAUTH_REQUIRED
      - LOGIN_RESULT_NOT_RECOVERABLE
      - LOGIN_OPERATION_NOT_FOUND
      - AUTH_BCRYPT_CAPACITY
      - AUTH_STATE_UNAVAILABLE
      - LOGIN_PROTOCOL_DISABLED
      - CSRF_DENIED
      - ORIGIN_NOT_ALLOWED
      - AUTH_FLOW_REQUIRED
      - AUTH_SESSION_INVALID
      - INVALID_AUTH_FLOW_TUPLE
      - AUTH_FLOW_GENERATION_STALE
      - AUTH_FLOW_ID_MISMATCH
      - AUTH_FLOW_EPOCH_STALE
      - AUTH_FLOW_COOKIE_INVALID
      - AUTH_OPERATION_ID_REUSED
      - AUTH_REFRESH_STALE
      - AUTH_OPERATION_RECEIPT_LIMIT
      - AUTH_OPERATION_SUPERSEDED
      - AUTH_OPERATION_RECEIPT_EXPIRED
      - AUTH_FLOW_REBOOTSTRAP_REQUIRED
      - AUTH_FLOW_NOT_FOUND
      - REFRESH_OPERATION_NOT_FOUND
      - AUTH_RECOVERY_RESULT_STALE
      - AUTH_FLOW_BOOTSTRAP_RATE_LIMITED
      - AUTH_FLOW_LEGACY_QUEUED
      - AUTH_RECOVERY_ALREADY_COMPLETED
      - AUTH_RECOVERY_IN_PROGRESS
      - AUTH_RECOVERY_LEASE_EXPIRED
      - INVALID_LOGIN_REQUEST
      - LEGACY_QUEUE_ACTIVE
    Lifecycle:
      type: string
      enum:
      - ANONYMOUS
      - AUTHENTICATING
      - AUTHENTICATED
      - RETIRED
    TicketStatus:
      type: string
      enum:
      - CLAIMED
      - PENDING
      - OFFERING
      - CREATING
      - WAITING
      - ADMITTING
      - READY
      - VERIFYING
      - RETRYABLE
      - REQUEUING
      - REQUEUE_OFFERING
      - REQUEUING_UNKNOWN
      - CONSUMED
      - CANCELLED
      - EXPIRED
    EnvelopeBase:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
          minLength: 1
        data: {}
      additionalProperties: false
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      additionalProperties: false
    TokenData:
      type: object
      required:
      - access_token
      - expires_in
      properties:
        access_token:
          type: string
          minLength: 1
          readOnly: true
        expires_in:
          type: string
          pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
          description: Canonical unsigned decimal string, within signed MySQL BIGINT range; no leading zeros.
          example: '1'
      additionalProperties: false
    TokenEnvelope:
      allOf:
      - "$ref": "#/components/schemas/EnvelopeBase"
      - type: object
        properties:
          message:
            type: string
            const: login success
          data:
            "$ref": "#/components/schemas/TokenData"
    OperationInProgressData:
      type: object
      required:
      - operationId
      - flowId
      - startingEpoch
      - status
      - resultEpoch
      - resultRevision
      properties:
        operationId:
          type: string
          format: uuid
        flowId:
          type: string
          format: uuid
        startingEpoch:
          type: string
          pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
          description: Canonical unsigned decimal string, within signed MySQL BIGINT range; no leading zeros.
          example: '1'
        status:
          type: string
