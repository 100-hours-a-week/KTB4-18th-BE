x-cookie-generation-contract:
  flow-cookie-generation: Monotonic per flow. Increment atomically when successful direct login, explicit successful session recovery, refresh, logout, or flow recreation commits and emits a new active flow cookie. Read-only status/bootstrap reuse does not increment if proof and expiry are unchanged. Every change to expiry/cookie purpose that could make a delayed Set-Cookie stale must use a distinct generation-scoped name. Explicit binding rebootstrap rotates flow-proof generation without changing epoch unless it fences an in-flight login.
  refresh-generation: Starts at 1 for a direct session. Each committed refresh and each explicit successful session recovery that renews expiry rotates the refresh token hash and increments the generation. DB accepts only the current generation; older cookie names/tokens are rejected.
  expiry-alignment: On login completion, explicit successful recovery, and refresh, MySQL session effective expiry and auth_browser_flows.cookie_expires_at commit to the same instant before emitting flow and refresh cookies with matching Max-Age.
  browser-binding-cookie: Separate per-flow generation-scoped HttpOnly cookie; fixed 1,800-second expiry; DB HMAC; not extended by read/rebootstrap. Accepted only by GET /api/v1/auth/flow; GET /api/v1/auth/flow/current-operation; GET /api/v1/auth/token/refresh/operations/{operationId}/session-recovery/current; GET /api/v1/auth/token/refresh/operations/{operationId}/session-recovery/{recoveryOperationId}; POST /api/v1/auth/flow/rebootstrap; POST /api/v1/auth/flows; POST /api/v1/auth/token/refresh/operations/{operationId}/session-recovery. It does not authorize login, ordinary refresh, logout, or protected APIs.
x-negative-receipt-policy:
  limit: 20
  windowSeconds: 900
  scope: flowId
  permitScope: 250 nonblocking permits per backend JVM process, implemented by the process-local localBcryptConcurrency semaphore. The current service has one backend process, so the effective cap is 250 for this deployment; it is not a cluster-wide cap and horizontal replicas multiply aggregate capacity unless a shared limiter is added in a separately reviewed design.
  countedStatuses:
  - NOT_ADMITTED
  lock: Each preflight, permit-result, receipt-insert, and operation-claim transaction locks auth_browser_flows FOR UPDATE, re-reads the exact flow-scoped operation ID, validates the flow/epoch tuple, and checks the live negative-receipt quota before any durable receipt or IN_PROGRESS write. After the permit attempt, repeat these checks because another request may have changed the flow or filled the quota.
  admissionOrder:
  - First look up the exact operation ID; then in a short flow-row-lock transaction re-read it, validate the tuple, and check the 20-live-receipt quota. If at limit, return 429 before attempting a permit.
  - If below quota, release the DB lock and make one nonblocking per-process BCrypt permit attempt. If unavailable, reacquire the flow lock and repeat exact-operation/tuple/quota/active-owner checks. At the limit return 429 without a receipt; if a peer owns the flow below the limit, persist NOT_ADMITTED with reason_code AUTH_LOGIN_IN_PROGRESS and return 409 AUTH_LOGIN_IN_PROGRESS; only if there is no peer owner and quota remains below 20 persist NOT_ADMITTED with reason_code AUTH_BCRYPT_CAPACITY and return 503.
  - If a permit was acquired, reacquire the flow lock and repeat exact-operation/tuple/quota/active-owner checks. If the quota reached 20 or another operation now owns the flow, release the permit before returning; never start BCrypt. At the quota limit return 429 without a receipt. Below the quota, a peer-owner conflict persists NOT_ADMITTED with reason_code AUTH_LOGIN_IN_PROGRESS and returns 409.
  - Only after an IN_PROGRESS owner claim is committed may BCrypt start outside the transaction.
  permitUnavailable: 'When all 250 process-local BCrypt permits are occupied, after the locked recheck confirms the operation is still new, the tuple is valid, no peer owner is active, and fewer than 20 negative receipts are live, return HTTP 503 AUTH_BCRYPT_CAPACITY and create a durable NOT_ADMITTED receipt with reason_code AUTH_BCRYPT_CAPACITY without BCrypt execution and without flow mutation. If a peer owner is active, apply quota precedence under the flow lock: when fewer than 20 negative receipts are live, return HTTP 409 AUTH_LOGIN_IN_PROGRESS and create one NOT_ADMITTED receipt with reason_code AUTH_LOGIN_IN_PROGRESS instead of a capacity receipt; when 20 negative receipts are live, including a peer-owner race that filled the quota, return HTTP 429 AUTH_OPERATION_RECEIPT_LIMIT with Retry-After and create no receipt. Release any provisionally acquired permit before a 409 or 429 rejection; BCrypt does not start and flow ownership is not changed.'
  atLimit: If a locked quota check finds 20 live negative receipts in the 900-second window, return HTTP 429 AUTH_OPERATION_RECEIPT_LIMIT with Retry-After and create no receipt. Do not attempt a permit when the initial locked check is at limit. If a permit was provisionally acquired after a below-limit check but a later locked recheck finds the limit full, release it before 429; no permit remains owned, BCrypt does not start, and the flow is not mutated.
  retention: Full negative receipt expires 900 seconds after terminal commit; retain a minimal non-secret ID tombstone until 86,400 seconds after receipt expiry; expired rows do not count toward the live 20-row cap.
  countedReasonCodes:
  - AUTH_BCRYPT_CAPACITY
  - AUTH_LOGIN_IN_PROGRESS
  policyOutcomeLabels:
  - CAPACITY_REJECTED
  - PEER_ACTIVE_REJECTED
  persistenceMapping:
    CAPACITY_REJECTED: NOT_ADMITTED + reason_code AUTH_BCRYPT_CAPACITY
    PEER_ACTIVE_REJECTED: NOT_ADMITTED + reason_code AUTH_LOGIN_IN_PROGRESS
    liveQuotaPredicate: status = 'NOT_ADMITTED' AND reason_code IN ('AUTH_BCRYPT_CAPACITY','AUTH_LOGIN_IN_PROGRESS') AND receipt_expires_at > CURRENT_TIMESTAMP(6)
x-exact-operation-replay:
  operations:
  - REFRESH
  - LOGOUT
  identity: "(flow_id, operation_kind, operation_id); startingEpoch and proof are immutable request bindings, not part of the unique key."
  lookup: After validating exact protocol marker and tuple shape, acquire flow then receipt locks and look up the exact direct-v2 receipt before applying current-generation checks.
  originalCookieProof: Original flow-cookie generation plus original refresh-cookie HMAC fingerprint for refresh; original flow-cookie generation for logout. The receipt startingEpoch and operation ID must match.
  resultCookieProof: Result flow-cookie generation and, for refresh, active refresh-cookie hash/generation must equal both the stored result and current canonical MySQL session.
  refreshReplay: Replay exact encrypted response body and exact result refresh cookie only while the original operation result is still canonical; do not mint a new access token or rotate a generation.
  logoutReplay: Replay only the exact anonymous result epoch/revision/generation, do not increment epoch again, and expire only the cookie names recorded for that operation.
  superseded: A newer login/refresh/logout returns 409 AUTH_OPERATION_SUPERSEDED with no Set-Cookie or token.
  expired: Full response receipt is valid for 900 seconds. During the next 86,400 seconds a minimal identity tombstone returns 409 AUTH_OPERATION_RECEIPT_EXPIRED with no Set-Cookie/token. After tombstone purge the idempotency horizon ends; FE's 900-second metadata has already expired.
