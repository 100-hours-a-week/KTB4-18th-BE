---
openapi: 3.1.0
info:
  title: Meomuneum direct-v2 authentication contract
  version: 2.4.0
  description: 'Cross-area semantic decisions are recorded in auth-contract-matrix.json; this OpenAPI is the exact wire-shape projection and must match it. Normative direct-v2 authentication contract only. Headerless legacy routes retain separate unchanged schemas. Browser-managed cookies are never read or constructed by FE. Refresh/logout operation replay is defined by original startingEpoch plus either original-cookie proof or exact result-cookie proof. MySQL is the canonical source for current-operation lookup and session state. GET /flow/current-operation is read-only and separate from bootstrap. For that lookup, a uniquely valid current direct flow proof wins; otherwise a valid browser-binding proof may be used only for the same flow identified by a rejected flow-proof cookie, or as the sole proof when no flow-proof cookie is present. A unique valid flow proof remains authoritative even if a different-flow binding cookie is also presented. If valid current flow-proof cookies resolve to more than one distinct flow, the result is ambiguous and returns generic AUTH_FLOW_NOT_FOUND without selecting by cookie order or attempting binding fallback. Cross-flow mismatch returns generic AUTH_FLOW_NOT_FOUND only when no current flow proof validates and the request is being resolved through binding fallback. Proposed refresh response-loss recovery: explicit user-triggered session recovery requires the DB-bound browser-binding proof. GET /flow/current-operation may omit flow tuple headers when sessionStorage is unreadable; FE must not guess them.'
servers:
- url: "/api/v1/auth"
paths:
  "/flow":
    get:
      operationId: getDirectAuthFlow
      description: Direct-v2 flow snapshot read. It never creates/upgrades a flow, changes expiry, emits/expires cookies, or changes a receipt/pointer. A fresh/no-proof caller receives typed 404; a valid direct or legacy flow proof may read the canonical snapshot. A valid binding proof without a usable flow proof receives typed 409 AUTH_FLOW_REBOOTSTRAP_REQUIRED. Flow creation/upgrading is the separate user-triggered credential-free POST /flows. Headerless legacy requests retain their existing contract. A resolved QUEUED flow (including a legacy flow) returns 409 AUTH_FLOW_LEGACY_QUEUED without mutation or cookies; direct-v2 success never reports QUEUED and currentTicket is null.
      parameters:
      - in: header
        name: X-Auth-Login-Protocol
        required: true
        description: Selects direct-v2 bootstrap.
        schema:
          type: string
          const: direct-v2
      responses:
        '200':
          description: Read-only canonical direct-v2 or legacy flow snapshot; no cookie or mutation.
          headers:
            X-Auth-Login-Protocol:
              required: true
              description: Direct-v2 capability marker.
              schema:
                type: string
                const: direct-v2
            X-Auth-Flow-Id:
              required: true
              description: Canonical flow ID.
              schema:
                type: string
                format: uuid
            X-Auth-Flow-Epoch:
              required: true
              description: Canonical flow epoch.
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
            X-Auth-Flow-Revision:
              required: true
              description: Canonical flow revision.
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FlowEnvelope"
        '400':
          description: Malformed or unsupported protocol marker.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeFlow400"
        '503':
          description: Canonical state unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeFlow503"
        '409':
          description: AUTH_FLOW_GENERATION_STALE or AUTH_FLOW_REBOOTSTRAP_REQUIRED; read-only response with no Set-Cookie. A resolved QUEUED flow returns AUTH_FLOW_LEGACY_QUEUED.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeFlow409"
          headers: {}
        '404':
          description: No valid flow proof; direct-v2 read never bootstraps a fresh flow.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeFlowRead404"
      security:
      - {}
      - DirectFlowProofCookie: []
      - BrowserBindingProofCookie: []
      - LegacyFlowCookie: []
  "/login":
    post:
      operationId: directLogin
      description: 'Browser MUST use credentials: include. HttpOnly proof cookie is browser-managed; FE never reads or writes Cookie. For the same flow-scoped operation ID, the service rechecks the ID under the flow lock before stale-epoch, capacity, active-owner or receipt decisions. Same startingEpoch joins/replays the existing operation; a different startingEpoch returns AUTH_OPERATION_ID_REUSED. During the tombstone horizon the same exact ID returns AUTH_OPERATION_RECEIPT_EXPIRED, never re-runs BCrypt.'
      parameters:
      - in: header
        name: X-Auth-Login-Protocol
        required: true
        description: Direct-v2 marker.
        schema:
          type: string
          const: direct-v2
      - in: header
        name: X-Auth-Flow-Id
        required: true
        description: Flow ID from bootstrap.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Auth-Flow-Epoch
        required: true
        description: Starting flow epoch.
        schema:
          type: string
          pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
          description: Canonical decimal signed-BIGINT-range string, no leading zeros.
          example: '7'
      - in: header
        name: X-Login-Operation-Id
        required: true
        description: Unique login operation ID.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-CSRF-TOKEN
        required: true
        description: Readable token returned as data.csrf_token by GET /token/csrf. The browser also sends the HttpOnly XSRF-TOKEN cookie.
        schema:
          type: string
          minLength: 1
      - in: header
        name: Origin
        required: true
        description: Browser-supplied exact allowed Origin; required for unsafe direct-v2 request.
        schema:
          type: string
          format: uri
          minLength: 1
      security:
      - DirectFlowProofCookie: []
        CsrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Committed login with readable access token and active cookies.
          headers:
            X-Login-Operation-Id:
              required: true
              description: Echoes the submitted operationId.
              schema:
                type: string
                format: uuid
            X-Auth-Flow-Id:
              required: true
              description: Canonical result flow ID.
              schema:
                type: string
                format: uuid
            X-Auth-Flow-Epoch:
              required: true
              description: Canonical result epoch.
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
            X-Auth-Flow-Revision:
              required: true
              description: Canonical result revision.
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
            Set-Cookie:
              required: true
              description: Sets MEO_AUTH_FLOW_V2_<base64url(SHA-256(UTF8(flow_id)))>_g<flow_cookie_generation> and refresh_token_v2_<base64url(SHA-256(UTF8(sid)))>_g<refresh_generation>; may separately expire presented stale generations. Emit each cookie as a separate physical Set-Cookie header; never comma-join. HttpOnly; Path=/api/v1/auth; no Domain; Secure follows auth.cookie.secure; SameSite follows auth.cookie.same-site (default Lax); Max-Age matches flowCookieExpiresAt or effective DB session expiry.
              schema:
                type: string
              x-multiple-header-lines: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenEnvelope"
        '202':
          description: Still processing; no Set-Cookie or token.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InProgressEnvelope"
        '400':
          description: Invalid protocol/tuple.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeLogin400"
        '401':
          description: Invalid credentials without account-existence disclosure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeLogin401"
        '403':
          description: CSRF or Origin rejected.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeLogin403"
        '409':
          description: Known flow conflict, including AUTH_OPERATION_ID_REUSED when this flow already owns the login operationId under another startingEpoch.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeLogin409"
        '503':
          description: Not admitted, protocol disabled, or canonical state unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeLogin503"
        '429':
          description: Per-flow negative-receipt budget is full; no operation receipt or auth work was created.
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
              description: Seconds until a new explicit user attempt is advisable. This response creates no operation receipt.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeLogin429"
  "/login/operations/{operationId}":
    get:
      operationId: getLoginOperation
      description: Read-only exact operation status. Cookie proof must match the proof generation captured by the operation or current generation. No cookie/token response.
      parameters:
      - in: path
        name: operationId
        required: true
        description: Operation ID; path is authoritative.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Auth-Login-Protocol
        required: true
        description: Direct-v2 marker.
        schema:
          type: string
          const: direct-v2
      - in: header
        name: X-Auth-Flow-Id
        required: true
        description: Original flow ID.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Auth-Flow-Epoch
        required: true
        description: Original starting epoch.
        schema:
          type: string
          pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
          description: Canonical decimal signed-BIGINT-range string, no leading zeros.
          example: '7'
      security:
      - DirectFlowProofCookie: []
      responses:
        '200':
          description: Terminal status with non-null result tuple.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TerminalStatusEnvelope"
        '202':
          description: Still processing; no Set-Cookie or token.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InProgressEnvelope"
        '400':
          description: Malformed protocol/tuple.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeOperation400"
        '404':
          description: No exact unexpired (flowId, startingEpoch, operationId) receipt exists. Does not reveal another epoch or account state.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeOperation404"
        '503':
          description: Canonical state unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeOperation503"
  "/login/operations/{operationId}/session-recovery":
    post:
      operationId: recoverLoginSession
      description: Bodyless explicit POST after user action; requires exact operation and still-current committed MySQL session.
      parameters:
      - in: path
        name: operationId
        required: true
        description: Operation ID; path is authoritative.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Auth-Login-Protocol
        required: true
        description: Direct-v2 marker.
        schema:
          type: string
          const: direct-v2
      - in: header
        name: X-Auth-Flow-Id
        required: true
        description: Original flow ID.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Auth-Flow-Epoch
        required: true
        description: Original starting epoch.
        schema:
          type: string
          pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
          description: Canonical decimal signed-BIGINT-range string, no leading zeros.
          example: '7'
      - in: header
        name: X-CSRF-TOKEN
        required: true
        description: Readable token returned as data.csrf_token by GET /token/csrf. The browser also sends the HttpOnly XSRF-TOKEN cookie.
        schema:
          type: string
          minLength: 1
      - in: header
        name: Origin
        required: true
        description: Browser-supplied exact allowed Origin; required for unsafe direct-v2 request.
        schema:
          type: string
          format: uri
          minLength: 1
      security:
      - DirectFlowProofCookie: []
        CsrfCookie: []
      responses:
        '200':
          description: Exact committed session recovered.
          headers:
            X-Login-Operation-Id:
              required: true
              description: Echoes the submitted operationId.
              schema:
                type: string
                format: uuid
            X-Auth-Flow-Id:
              required: true
              description: Canonical result flow ID.
              schema:
                type: string
                format: uuid
            X-Auth-Flow-Epoch:
              required: true
              description: Canonical result epoch.
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
            X-Auth-Flow-Revision:
              required: true
              description: Canonical result revision.
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
            Set-Cookie:
              required: true
              description: Sets active MEO_AUTH_FLOW_V2_<base64url(SHA-256(UTF8(flow_id)))>_g<flow_cookie_generation> and refresh_token_v2_<base64url(SHA-256(UTF8(sid)))>_g<refresh_generation> cookies. Emit each cookie as a separate physical Set-Cookie header; never comma-join. HttpOnly; Path=/api/v1/auth; no Domain; Secure follows auth.cookie.secure; SameSite follows auth.cookie.same-site (default Lax); Max-Age matches flowCookieExpiresAt or effective DB session expiry.
              schema:
                type: string
              x-multiple-header-lines: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenEnvelope"
        '202':
          description: Still processing; no Set-Cookie or token.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InProgressEnvelope"
        '400':
          description: Malformed protocol/tuple.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeRecovery400"
        '403':
          description: CSRF or Origin rejected.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeRecovery403"
        '404':
          description: Operation, proof, or tuple is absent, mismatched, or expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeRecovery404"
        '409':
          description: Operation result or active session is not recoverable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeRecovery409"
        '503':
          description: Canonical state unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeRecovery503"
  "/token/refresh":
    post:
      operationId: refreshDirectSession
      description: Direct-v2 refresh. X-Auth-Flow-Epoch is the immutable original startingEpoch for this operation, not a value refreshed before retry. After an uncertain outcome FE persists only non-secret operation metadata and manually retries with the same operation ID and startingEpoch. The browser supplies HttpOnly flow and DB-selected refresh cookies. An exact receipt may replay when either original request cookies match the recorded proof or result cookies match the exact current DB result. A later authentication mutation or expired receipt returns 409 with no Set-Cookie/token. DB cookie_mode continues to select legacy or generation-scoped refresh cookies.
      parameters:
      - in: header
        name: X-Auth-Login-Protocol
        required: true
        description: Direct-v2 marker.
        schema:
          type: string
          const: direct-v2
      - in: header
        name: X-Auth-Flow-Id
        required: true
        description: Current flow ID.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Auth-Flow-Epoch
        required: true
        description: The immutable startingEpoch captured on the first request for this operation. Every same-operation retry after an uncertain result MUST repeat this original value, even if the successful mutation already advanced the canonical current epoch.
        schema:
          type: string
          pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
          description: Canonical decimal signed-BIGINT-range string, no leading zeros.
          example: '7'
      - in: header
        name: X-Refresh-Operation-Id
        required: true
        description: Stable operationId for this refresh/logout mutation. A same-operation retry MUST reuse this value and the original startingEpoch. A new ID means a distinct user-requested mutation.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-CSRF-TOKEN
        required: true
        description: Readable token returned as data.csrf_token by GET /token/csrf. The browser also sends the HttpOnly XSRF-TOKEN cookie.
        schema:
          type: string
          minLength: 1
      - in: header
        name: Origin
        required: true
        description: Browser-supplied exact allowed Origin.
        schema:
          type: string
          format: uri
          minLength: 1
