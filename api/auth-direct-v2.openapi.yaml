  "/flow/current-operation":
    get:
      operationId: getCurrentAuthOperation
      summary: Read current flow and direct authentication operation from MySQL
      description: Read-only reconciliation for a browser that cannot read sessionStorage metadata or has lost a current flow-proof cookie. Cookie header order is ignored. First validate all presented direct-v2 flow-proof cookies against the current MySQL flow key, generation, HMAC, and expiry. If exactly one distinct current flow validates, it is authoritative and data.flow.proofState is ACTIVE. If valid current flow-proof cookies resolve to multiple distinct flows, fail with generic 404 AUTH_FLOW_NOT_FOUND regardless of cookie order and do not attempt binding fallback; a binding cookie never overrides it, including a valid binding cookie for another flow; that unrelated binding cookie is ignored for selection. If no current flow proof validates, a browser-binding proof may be used only when its database-bound HMAC, active generation, and fixed expiry validate. When one or more direct flow-proof cookie names were presented, fallback must match their single distinct flow key; multiple distinct rejected flow keys or a different binding flow is ambiguous and returns generic 404 AUTH_FLOW_NOT_FOUND only during fallback, because no current flow proof validated. A unique valid current flow proof remains authoritative even if a different-flow binding cookie is also presented. When no flow-proof cookie was presented, exactly one valid binding flow may resolve the lookup. Successful binding fallback returns data.flow.proofState=REBOOTSTRAP_REQUIRED. Binding proof grants no session, token, login, or protected-API authority. This operation reads the flow and current-operation pointer from a consistent MySQL snapshot; it never bootstraps, changes state, updates expiry, repairs or expires cookies, or returns credentials/tokens. MySQL is authoritative; Hazelcast is not a fallback. The X-Auth-Flow-Id and X-Auth-Flow-Epoch request headers are optional. If sessionStorage is unreadable, omit both and use only browser-managed proof cookies; return the canonical flow and current-operation pointer or null without mutation or cookies. A resolved QUEUED flow (including a legacy flow) returns 409 AUTH_FLOW_LEGACY_QUEUED without mutation or cookies; direct-v2 success never reports QUEUED and currentTicket is null.
      parameters:
      - in: header
        name: X-Auth-Login-Protocol
        required: true
        description: Selects the direct-v2 contract. X-Auth-Flow-Id and X-Auth-Flow-Epoch are optional for this read-only discovery GET; when storage is unavailable, omit both and let proof cookies select the canonical flow. Never guess tuple headers.
        schema:
          type: string
          const: direct-v2
      security:
      - DirectFlowProofCookie: []
      - BrowserBindingProofCookie: []
      responses:
        '200':
          description: Canonical MySQL flow snapshot and current operation, if an unexpired receipt is available. A valid direct flow proof returns proofState ACTIVE; a valid matching binding fallback returns proofState REBOOTSTRAP_REQUIRED. No response sets or expires cookies.
          headers:
            Cache-Control:
              required: true
              description: Every response is non-cacheable, including protocol, not-found, and canonical-state errors.
              schema:
                type: string
                const: no-store
            X-Auth-Login-Protocol:
              required: true
              schema:
                type: string
                const: direct-v2
            X-Auth-Flow-Id:
              required: true
              schema:
                type: string
                format: uuid
            X-Auth-Flow-Epoch:
              required: true
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
            X-Auth-Flow-Revision:
              required: true
              schema:
                type: string
                pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
                description: Canonical decimal signed-BIGINT-range string, no leading zeros.
                example: '7'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CurrentOperationEnvelope"
        '400':
          description: Protocol marker absent or invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeCurrentOperation400"
          headers:
            Cache-Control:
              required: true
              description: Every response is non-cacheable, including protocol, not-found, and canonical-state errors.
              schema:
                type: string
                const: no-store
        '404':
          description: 'Generic AUTH_FLOW_NOT_FOUND when no unambiguous valid proof resolves a flow. This includes missing/invalid/stale flow proof without a valid matching binding proof, expired/invalid binding proof, cross-flow binding fallback when no current flow proof validates, or valid current flow-proof cookies resolving to multiple distinct flows. Multiple distinct valid current flows are ambiguous: do not select by cookie order or attempt binding fallback. A unique valid current flow proof is authoritative even if an unrelated binding cookie is present.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeCurrentOperation404"
          headers:
            Cache-Control:
              required: true
              description: Every response is non-cacheable, including protocol, not-found, and canonical-state errors.
              schema:
                type: string
                const: no-store
        '503':
          description: MySQL canonical state unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeCurrentOperation503"
          headers:
            Cache-Control:
              required: true
              description: Every response is non-cacheable, including protocol, not-found, and canonical-state errors.
              schema:
                type: string
                const: no-store
        '409':
          description: AUTH_FLOW_LEGACY_QUEUED; no state change or cookie.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelopeCurrentOperation409"
      x-side-effects: []
      x-no-set-cookie: true
      x-auth-proof-selection:
        cookieOrderMatters: false
        precedence:
        - A uniquely valid current direct flow-proof cookie is authoritative and yields proofState ACTIVE, even if a binding cookie for another flow is also present; ignore the unrelated binding cookie for selection.
        - If valid current flow-proof cookies resolve to more than one distinct flow, fail with 404 AUTH_FLOW_NOT_FOUND regardless of cookie order and do not attempt binding fallback.
        - Only if no current flow-proof cookie validates may a valid browser-binding proof be considered for read-only lookup.
        - During binding fallback, if rejected flow-proof cookie names identify exactly one flow key, the binding proof must resolve that same flow key; a different flow key fails closed.
        - If no flow-proof cookie was presented, exactly one valid binding flow may resolve the lookup.
        - If no current flow proof validates and fallback cannot resolve one unambiguous flow, return 404 AUTH_FLOW_NOT_FOUND.
        bindingProofValidation:
        - The browser-binding cookie generation is the active generation recorded in MySQL.
        - The cookie value validates against the database-bound HMAC.
        - The fixed binding-cookie expiry is later than the database clock.
        bindingFallbackProofState: REBOOTSTRAP_REQUIRED
        bindingProofAuthorities:
        - read current flow and operation snapshot
        sideEffects:
          databaseMutation: false
          setCookie: false
          expireCookie: false
          returnCredentialOrToken: false
        failedResolution:
          httpStatus: 404
          publicCode: AUTH_FLOW_NOT_FOUND
        multipleValidFlowProofs:
          condition: valid current flow-proof candidates resolve to more than one distinct flow
          httpStatus: 404
          publicCode: AUTH_FLOW_NOT_FOUND
          selectByCookieOrder: false
          attemptBindingFallback: false
  "/flow/rebootstrap":
    post:
      operationId: rebootstrapDirectAuthFlow
      summary: Explicitly restore the direct flow proof using the short-lived binding cookie
      description: User-triggered state mutation only; never call automatically on load, timer, or after a read. Locks flow → rebootstrap receipt → login operation. Fences a live worker by epoch/owner compare-and-set, preserves a session committed first, and returns only a new generation-scoped flow-proof cookie. Exact same-ID retry is permitted only while its 900-second receipt remains canonical; its epoch is not incremented twice.
      parameters:
      - in: header
        name: X-Auth-Login-Protocol
        required: true
        schema:
          type: string
          const: direct-v2
      - in: header
        name: X-Auth-Flow-Id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Auth-Flow-Epoch
        required: true
        description: Original startingEpoch captured before the user initiated rebootstrap; same value is reused on exact replay.
