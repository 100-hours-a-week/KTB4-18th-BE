      additionalProperties: false
    TerminalOperationData:
      type: object
      required:
      - operationId
      - flowId
      - startingEpoch
      - status
      - resultEpoch
      - resultRevision
      - reasonCode
      properties:
        operationId:
          type: string
          format: uuid
        flowId:
          type: string
          format: uuid
        startingEpoch:
          type: string
          pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
          description: Canonical unsigned decimal string, within signed MySQL BIGINT range; no leading zeros.
          example: '1'
        status:
          type: string
          enum:
          - SUCCEEDED
          - INVALID_CREDENTIALS
          - SUPERSEDED
          - REAUTH_REQUIRED
          - NOT_ADMITTED
        resultEpoch:
          type: string
          pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
          description: Canonical unsigned decimal string, within signed MySQL BIGINT range; no leading zeros.
          example: '1'
        resultRevision:
          type: string
          pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
          description: Canonical unsigned decimal string, within signed MySQL BIGINT range; no leading zeros.
          example: '1'
        reasonCode:
          type:
          - string
          - 'null'
          enum:
          - AUTH_BCRYPT_CAPACITY
          - AUTH_LOGIN_IN_PROGRESS
          -
          description: Always present. AUTH_BCRYPT_CAPACITY or AUTH_LOGIN_IN_PROGRESS when status is NOT_ADMITTED; null for every other terminal status.
      additionalProperties: false
      allOf:
