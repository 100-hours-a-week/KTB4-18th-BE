      INVALID_CREDENTIALS: lease_expires_at and reason_code are NULL; receipt_expires_at, tombstone_purge_at, completed_at, proof_generation, result_epoch, and result_revision are NOT NULL; result_sid, result_flow_cookie_generation, result_refresh_generation, and recovery fields are NULL.
      SUPERSEDED: lease_expires_at and reason_code are NULL; receipt_expires_at, tombstone_purge_at, completed_at, proof_generation, result_epoch, and result_revision are NOT NULL; result_sid, result_flow_cookie_generation, result_refresh_generation, and recovery fields are NULL.
