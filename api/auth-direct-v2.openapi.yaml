x-security-protocol-contract:
  protocolHeader: X-Auth-Login-Protocol
  legacy: Header absent preserves the current legacy route, login CSRF exemption, and Referer fallback exactly.
  directV2: Exact single value direct-v2 selects the direct-v2 policy. Unsafe requests require valid CSRF cookie and X-CSRF-TOKEN header plus an actual exact allowlisted Origin; Referer cannot substitute.
  invalidMarker: Blank, repeated, malformed, or unknown marker returns HTTP 400 INVALID_LOGIN_PROTOCOL before CSRF or Origin evaluation and never falls back to legacy. Direct-only routes also reject a missing marker as INVALID_LOGIN_PROTOCOL; only routes explicitly preserving legacy behavior may omit it. Exact direct-v2 with invalid CSRF remains 403 CSRF_DENIED before Origin; exact direct-v2 with valid CSRF then requires actual allowlisted Origin.
  oldBackendRouting: Infrastructure-owned rollout routing that prevents requests reaching unsupported old binaries is excluded from this contract and implementation.
  admissionControl:
    property: auth.direct-v2.enabled
    environmentAlias: AUTH_DIRECT_V2_ENABLED
    default: false
    runtimeControl: DirectAuthAdmissionFilter runs after CSRF and Origin validation. Spring property auth.direct-v2.enabled (environment alias AUTH_DIRECT_V2_ENABLED) is read at process startup; changing it requires restarting the compatible backend process. There is no unauthenticated or public toggle endpoint.
    whenDisabled: After CSRF and Origin validation, POST /api/v1/auth/flows and direct-v2 POST /api/v1/auth/login return 503 LOGIN_PROTOCOL_DISABLED before new flow/login admission is committed.
    stillAvailable: Read-only flow/current-operation/status, explicit existing-operation recovery and rebootstrap, refresh/logout for canonical direct sessions, and all legacy queue routes remain available. Direct requests never downgrade to legacy.
  markerFilter: DirectAuthProtocolMarkerFilter runs before Spring CsrfFilter. It rejects invalid/repeated markers and a missing marker on direct-only paths. Missing marker on legacy-compatible /login and legacy refresh/logout behavior passes unchanged.
