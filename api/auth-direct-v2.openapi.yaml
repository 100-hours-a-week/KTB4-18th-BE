x-replay-ciphertext-contract:
  newFormat: rrc:v2:<base64url-no-padding(version-byte=2 || 12-byte-IV || AES-GCM ciphertext || 16-byte tag)>
  legacyFormat: Unprefixed base64 IV || AES-GCM ciphertext/tag; legacy decrypt supplies no AAD and remains only for existing session/queue/legacy receipt rows.
  v2Payloads:
  - operation-response-body
  - refresh-cookie-token
  - rebootstrap-flow-cookie
  - refresh-recovery-response-body
  - refresh-recovery-refresh-cookie
  - refresh-recovery-flow-cookie
  - bootstrap-exact-response
  storage: Distinct payload types map respectively to auth_direct_operation_receipts.encrypted_result_response_body and .encrypted_result_refresh_token; auth_flow_rebootstrap_operations.result_flow_cookie_ciphertext; auth_refresh_recovery_operations.encrypted_result_response_body, .encrypted_result_refresh_cookie and .encrypted_result_flow_cookie; auth_flow_bootstrap_operations.encrypted_exact_response. Bootstrap payload contains exact body and ordered physical Set-Cookie lines. No plaintext secrets persist.
  aadFields:
  - payloadType
  - tablePurpose
  - operationKind
  - flowId
  - sourceOperationId
  - auxiliaryOperationId
  - startingEpoch
  - resultEpoch
  - resultRevision
  - resultFlowCookieGeneration
  - resultRefreshGeneration
  - bindingGeneration
  - resultBindingGeneration
  - requestFingerprint
  - initialProofFingerprint
  aadEncoding: In the listed order, encode each field as 4-byte unsigned big-endian UTF-8 byte length then bytes. UUIDs are lowercase canonical hyphenated; integers are unsigned canonical decimal without leading zeros. Inapplicable or unavailable values are zero length, distinct from numeric zero; required fields are never empty. Fingerprints are 32 bytes encoded as 64 lowercase hexadecimal ASCII characters; absent initial proof fingerprint is zero length.
  failure: Unknown version, malformed envelope, invalid tag, swapped row/column/payload, or mismatched AAD fails closed with no token or cookie.
  key: 'Use HKDF-SHA256 extract-and-expand with the exact existing high-entropy encryption-key bytes as IKM, fixed public UTF-8 salt meomuneum/auth-replay/v2/hkdf-salt and fixed UTF-8 info meomuneum/auth-replay/v2/aes-256-gcm, output 32 bytes as the AES-256-GCM v2 key. Salt and info have no terminator. They are domain labels, not secrets; reject missing, malformed, or insufficient-entropy key material rather than treating a password as a key. Unprefixed v1 data continues to use the original key and existing no-AAD decrypt path. Only rrc:v2: with version byte 2 dispatches to the derived v2 key and specified AAD; unknown prefixes, versions, malformed envelopes, invalid tags, wrong keys, and AAD mismatches fail closed without fallback or credential output.'
  aadBindings:
    direct: tablePurpose auth_direct_operation_receipts; operationKind REFRESH or LOGOUT; sourceOperationId is operation ID; auxiliaryOperationId empty.
    rebootstrap: tablePurpose auth_flow_rebootstrap_operations; operationKind REBOOTSTRAP; sourceOperationId is rebootstrap ID; auxiliaryOperationId empty.
    recovery: tablePurpose auth_refresh_recovery_operations; operationKind REFRESH_RECOVERY; sourceOperationId is source REFRESH ID; auxiliaryOperationId is recovery ID.
    bootstrap: tablePurpose auth_flow_bootstrap_operations; operationKind BOOTSTRAP; sourceOperationId is bootstrap ID; auxiliaryOperationId empty; startingEpoch empty if no starting flow. Bind resultBindingGeneration, requestFingerprint and nullable initialProofFingerprint from committed receipt; those three are empty for other payloads.
    common: Bind each available result epoch/revision, flow/refresh generation and request binding generation from immutable committed receipt; encode genuinely inapplicable fields empty. Never use mutable current values as captured AAD.
  ivUniqueness: auth_replay_iv_allocators is scoped by the derived v2 key identifier; reserve and commit independently before encryption, never reuse or wrap. Unsafe restore, failure, exhaustion or key mismatch fails closed; no silent reset or rotation.
  rebootstrapReplay: Commit ciphertext with result tuple and proof HMAC; same-ID replay emits identical decrypted cookie only while live and canonical, without another generation rotation. Expiry clears ciphertext before tombstone; no replay after expiry.
  keyIdentifierAndRotation: 'The key identifier is lowercase hex SHA-256 of UTF-8 meomuneum/auth-replay/v2/key-id immediately followed by the 32 derived key bytes; it identifies key material without storing or logging key bytes. Every instance derives the same identifier and allocates from the same durable row. Never reset, delete, clone, or reuse its counter while that key can be used. Rotation is not supported by the current v2 envelope because it contains no key ID: fail closed on any configured key mismatch and do not try multiple keys. A future approved versioned key-selector and retained old key are required before rotation with outstanding ciphertext. A database restore must prove the allocator high-water mark exceeds every IV ever reserved under this derived key, including reservations lost by the restore; otherwise block all v2 encryption and fail closed until a separately designed new-key/versioned migration is safely deployed. Keep the original v1 key and decrypt path available throughout; never silently reset the allocator or rotate the legacy key.'
  versionDispatch: Unprefixed legacy v1 uses only the original key and existing no-AAD decrypt; rrc:v2 with byte 2 uses only the derived v2 key and v2 AAD; unknown prefixes/versions, malformed data, wrong keys, modified tags or AAD fail closed without fallback.
  keyPin: Persist a single active identifier in a separately provisioned durable singleton pin. Every instance compares its computed identifier before v2 encrypt or decrypt; missing pin or mismatch fails closed. Provision only on an attested new installation before any v2 IV was reserved, never automatically after restore.
x-operation-retention-contract:
  inProgress:
