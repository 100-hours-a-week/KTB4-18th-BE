        - result_revision
        - completed_at
        requiredNull:
        - lease_expires_at
        - result_sid
        - reason_code
        - result_flow_cookie_generation
        - result_refresh_generation
        - recovery_result_epoch
        - recovery_result_revision
        - recovery_flow_cookie_generation
        - recovery_refresh_generation
        - recovery_completed_at
      SUPERSEDED:
        requiredNonNull:
        - proof_generation
        - receipt_expires_at
