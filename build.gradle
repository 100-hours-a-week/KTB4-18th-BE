// Separate JVM lifecycle tests deliberately kill only the server process they create.
tasks.register('chatProcessTest', Test) {
	dependsOn 'classes'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
