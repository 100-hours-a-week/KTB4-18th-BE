plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.muse'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Temporary local profile: stage only migrations needed by music-record development.
tasks.register('prepareMusicRecordLocalMigrations', Sync) {
	from('src/main/resources/db/migration') {
		include 'V1__recommendation_sample.sql'
		include 'V20260921192804__add_index_to_recommendation_session_context.sql'
		include 'V20260921200528__create_users_table.sql'
		include 'V20260923093759__create_music_record_tables.sql'
	}
	into layout.buildDirectory.dir('music-record-local-migrations')
}

// Isolated signup verification profile; keep the existing music-record migration set unchanged.
tasks.register('prepareMusicRecordSignupLocalMigrations', Sync) {
	from('src/main/resources/db/migration') {
		include 'V1__recommendation_sample.sql'
		include 'V20260921192804__add_index_to_recommendation_session_context.sql'
		include 'V20260921200528__create_users_table.sql'
		include 'V20260922145107__add_auto_increment_to_users_id.sql'
		include 'V20260922145108__create_terms_and_agreements_tables.sql'
		include 'V20260922195140__add_terms_type_version_unique_constraint.sql'
		include 'V20260923093759__create_music_record_tables.sql'
	}
	from('src/main/resources/db/music-record-signup-local')
	into layout.buildDirectory.dir('music-record-signup-local-migrations')
}

tasks.named('bootRun') {
	dependsOn 'prepareMusicRecordLocalMigrations'
	dependsOn 'prepareMusicRecordSignupLocalMigrations'
}

tasks.named('test') {
	dependsOn 'prepareMusicRecordLocalMigrations'
	dependsOn 'prepareMusicRecordSignupLocalMigrations'
}
