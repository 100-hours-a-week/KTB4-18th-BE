name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# PR에 새 커밋이 오면 이전 실행은 취소함
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 테스트 전용 MySQL. 운영과 같은 8.4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: meomuneum_test
          MYSQL_USER: meomuneum_test
          MYSQL_PASSWORD: ci-test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/meomuneum_test
      TEST_DB_USERNAME: meomuneum_test
      TEST_DB_PASSWORD: ci-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew check --no-daemon
