spring:
  datasource:
    url: ${DEV_DB_URL:jdbc:mysql://localhost:3306/meomuneum_dev}
    username: ${DEV_DB_USERNAME:meomuneum_dev}
    password: ${DEV_DB_PASSWORD}

auth:
  direct-v2:
    enabled: ${AUTH_DIRECT_V2_ENABLED:true}
    refresh-verified: ${AUTH_DIRECT_V2_REFRESH_VERIFIED:true}
    refresh-recovery-verified: ${AUTH_DIRECT_V2_REFRESH_RECOVERY_VERIFIED:false}
    rebootstrap-verified: ${AUTH_DIRECT_V2_REBOOTSTRAP_VERIFIED:false}
  mutation-gate-open: ${AUTH_MUTATION_GATE_OPEN:true}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  state:
    hazelcast:
      enabled: ${DEV_AUTH_STATE_HAZELCAST_ENABLED:${AUTH_STATE_HAZELCAST_ENABLED:true}}
      members: ${DEV_AUTH_STATE_HAZELCAST_MEMBERS:${AUTH_STATE_HAZELCAST_MEMBERS:}}
      cluster-name: ${DEV_AUTH_STATE_HAZELCAST_CLUSTER_NAME:meomuneum-auth-dev}
    expected-hazelcast-members: ${DEV_AUTH_STATE_HAZELCAST_EXPECTED_MEMBER_COUNT:${AUTH_STATE_HAZELCAST_EXPECTED_MEMBER_COUNT:3}}

# 로그인 구현 전 로컬 추천 개발에만 비로그인 접근 허용
recommendation:
  allow-guests: true

speech:
  transcription:
    provider: ${SPEECH_TRANSCRIPTION_PROVIDER:stub}
    stub-transcript: ${SPEECH_TRANSCRIPTION_STUB_TRANSCRIPT:비 올 때 듣기 좋은 노래를 추천해줘}
