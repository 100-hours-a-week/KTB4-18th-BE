spring:
  datasource:
    url: jdbc:mysql://mysql:3306/meomuneum_perf?connectionTimeZone=UTC
    username: meomuneum_perf
    password: ${PERF_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: false
        path: /api/v1
management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: meomuneum-performance
    distribution:
      percentiles-histogram:
        http.server.requests: true
        performance.recommendation.queue.wait: true
        performance.chat.lock.wait: true
        performance.chat.lock.hold: true
        performance.chat.db.store: true
        performance.recommendation.first.text: true
recommendation:
  allow-guests: false
performance:
  metrics-enabled: true
