management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: meomuneum-backend
      namespace: loadtest
server:
  tomcat:
    mbeanregistry:
      enabled: true
auth:
