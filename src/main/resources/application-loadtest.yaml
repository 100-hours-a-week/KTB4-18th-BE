management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: meomuneum-backend
      namespace: loadtest
server:
  tomcat:
    mbeanregistry:
      enabled: true
auth:
  state:
    max-active-tickets: ${AUTH_MAX_ACTIVE_TICKETS:150}
  queue:
    diagnostics:
      enabled: ${AUTH_QUEUE_DIAGNOSTICS_ENABLED:false}
      run-id: ${AUTH_QUEUE_DIAGNOSTICS_RUN_ID:}
    reserve-permit-on-ready: ${AUTH_QUEUE_RESERVE_PERMIT_ON_READY:false}
