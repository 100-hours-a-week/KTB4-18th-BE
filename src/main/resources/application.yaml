spring:
  application:
    name: meomuneum-backend

  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true
        path: /api/v1/auth
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

auth:
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:project-api}
    audience: ${AUTH_JWT_AUDIENCE:project-api}
    secret: ${AUTH_JWT_SECRET}
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600

recommendation:
  itunes:
    country: ${RECOMMENDATION_ITUNES_COUNTRY:US}
    timeout: ${RECOMMENDATION_ITUNES_TIMEOUT:8s}

kakao:
  maps:
    rest-api-key: ${KAKAO_REST_API_KEY:}

speech:
  transcription:
    provider: ${SPEECH_TRANSCRIPTION_PROVIDER:unavailable}
