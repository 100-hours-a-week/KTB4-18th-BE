spring:
  application:
    name: meomuneum-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 15d
      cookie:
        http-only: true
        same-site: lax
        secure: ${AUTH_COOKIE_SECURE:true}
        path: /api/v1/auth

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:project-api}
    audience: ${AUTH_JWT_AUDIENCE:project-api}
    secret: ${AUTH_JWT_SECRET}
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600

recommendation:
  provider: ${RECOMMENDATION_PROVIDER:ai}
  itunes:
    country: ${RECOMMENDATION_ITUNES_COUNTRY:US}
    timeout: ${RECOMMENDATION_ITUNES_TIMEOUT:8s}
  ai:
    base-url: ${RECOMMENDATION_AI_BASE_URL}
    connect-timeout: ${RECOMMENDATION_AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${RECOMMENDATION_AI_READ_TIMEOUT:120s}

kakao:
  maps:
    rest-api-key: ${KAKAO_REST_API_KEY:}

speech:
  transcription:
    provider: ${SPEECH_TRANSCRIPTION_PROVIDER:ai}
    audio:
      ffmpeg-path: ${SPEECH_AUDIO_FFMPEG_PATH:ffmpeg}
      processing-timeout: ${SPEECH_AUDIO_PROCESSING_TIMEOUT:15s}
      temporary-directory: ${SPEECH_AUDIO_TEMPORARY_DIRECTORY:${java.io.tmpdir}}
    ai:
      base-url: ${SPEECH_TRANSCRIPTION_AI_BASE_URL}
      connect-timeout: ${SPEECH_TRANSCRIPTION_AI_CONNECT_TIMEOUT:3s}
      read-timeout: ${SPEECH_TRANSCRIPTION_AI_READ_TIMEOUT:70s}

location:
  token:
    secret: ${LOCATION_TOKEN_SECRET}
  reverse-geocoding:
    base-url: ${LOCATION_REVERSE_GEOCODING_BASE_URL}
    rest-api-key: ${LOCATION_KAKAO_REST_API_KEY:}
    connect-timeout: ${LOCATION_REVERSE_GEOCODING_CONNECT_TIMEOUT:2s}
    read-timeout: ${LOCATION_REVERSE_GEOCODING_READ_TIMEOUT:3s}

chat:
  message-cleanup:
    enabled: ${CHAT_MESSAGE_CLEANUP_ENABLED:true}
  message-policy:
    minimum-interval: ${CHAT_MESSAGE_MINIMUM_INTERVAL:1s}
    detection-enabled: ${CHAT_PERSONAL_CONTENT_DETECTION_ENABLED:true}
    automatic-ban-enabled: ${CHAT_AUTOMATIC_BAN_ENABLED:true}
    profanity: [씨발, 개새끼]
    obscenity: [자지 빨아, 보지 빨아]
